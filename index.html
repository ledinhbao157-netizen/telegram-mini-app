<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: #1f2937;
            padding: 30px 20px;
            border-radius: 20px;
        }

        p {
            color: #9ca3af;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #229ED9;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Xin chào 👋</h1>

        <p>
            Đây là Telegram Mini App đầu tiên của tôi.
        </p>

        <button onclick="hello()">
            Bấm vào đây
        </button>
    </div>

    <script>
        function hello() {
            alert("Bạn vừa bấm nút!");
        }
    </script>

</body>
</html>
