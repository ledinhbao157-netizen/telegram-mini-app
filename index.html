<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tài khoản cá nhân</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #111827);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 25px 18px 40px;
        }

        .profile {
            text-align: center;
            padding: 20px 0 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #229ED9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile h1 {
            margin: 15px 0 5px;
            font-size: 25px;
        }

        .username {
            opacity: 0.6;
            font-size: 15px;
        }

        .card {
            background: var(
                --tg-theme-secondary-bg-color,
                #1f2937
            );

            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(128,128,128,0.18);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            opacity: 0.6;
        }

        .value {
            font-weight: bold;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(128,128,128,0.18);
        }

        .menu:last-child {
            border-bottom: none;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(34,158,217,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .arrow {
            opacity: 0.5;
            font-size: 20px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            background: #229ED9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            opacity: 0.55;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- PROFILE -->

    <div class="profile">

        <div class="avatar" id="avatar">
            👤
        </div>

        <h1 id="name">
            Đang tải...
        </h1>

        <div class="username" id="username">
            @username
        </div>

    </div>


    <!-- ACCOUNT INFORMATION -->

    <div class="card">

        <div class="card-title">
            🆔 Thông tin tài khoản
        </div>

        <div class="row">
            <span class="label">
                Họ và tên
            </span>

            <span class="value" id="fullname">
                ...
            </span>
        </div>

        <div class="row">
            <span class="label">
                Username
            </span>

            <span class="value" id="user">
                ...
            </span>
        </div>

        <div class="row">
            <span class="label">
                Telegram ID
            </span>

            <span class="value" id="userid">
                ...
            </span>
        </div>

    </div>


    <!-- MENU -->

    <div class="card">

        <div class="card-title">
            ⚙️ Cài đặt
        </div>

        <div class="menu" onclick="comingSoon()">

            <div class="menu-left">

                <div class="icon">
                    🔔
                </div>

                <span>
                    Thông báo
                </span>

            </div>

            <span class="arrow">
                ›
            </span>

        </div>


        <div class="menu" onclick="comingSoon()">

            <div class="menu-left">

                <div class="icon">
                    🌙
                </div>

                <span>
                    Giao diện
                </span>

            </div>

            <span class="arrow">
                ›
            </span>

        </div>


        <div class="menu" onclick="comingSoon()">

            <div class="menu-left">

                <div class="icon">
                    🔐
                </div>

                <span>
                    Bảo mật
                </span>

            </div>

            <span class="arrow">
                ›
            </span>

        </div>

    </div>


    <button onclick="closeApp()">
        Đóng Mini App
    </button>


    <div class="status">
        ● Đã kết nối với Telegram
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    const user = tg.initDataUnsafe.user;


    if (user) {

        const firstName =
            user.first_name || "";

        const lastName =
            user.last_name || "";

        const fullName =
            (firstName + " " + lastName).trim();


        document.getElementById("name")
            .innerText =
            firstName || "Người dùng";


        document.getElementById("fullname")
            .innerText =
            fullName || "Không có";


        document.getElementById("user")
            .innerText =
            user.username
                ? "@" + user.username
                : "Không có";


        document.getElementById("userid")
            .innerText =
            user.id;


        document.getElementById("username")
            .innerText =
            user.username
                ? "@" + user.username
                : "Telegram";


        const avatar =
            document.getElementById("avatar");


        if (user.photo_url) {

            avatar.innerHTML =
                '<img src="' +
                user.photo_url +
                '" alt="Avatar">';

        } else {

            avatar.innerText =
                firstName
                    ? firstName.charAt(0).toUpperCase()
                    : "👤";

        }

    }


    function comingSoon() {

        tg.HapticFeedback
            .impactOccurred("light");

        tg.showAlert(
            "Tính năng này sẽ được phát triển ở bước tiếp theo."
        );

    }


    function closeApp() {

        tg.HapticFeedback
            .impactOccurred("medium");

        tg.close();

    }

</script>

</body>
</html>
