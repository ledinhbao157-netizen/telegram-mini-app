<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Telegram Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #111827);
            color: var(--tg-theme-text-color, white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
        }

        .card {
            padding: 30px 20px;
            border-radius: 20px;
            background: var(--tg-theme-secondary-bg-color, #1f2937);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #229ED9;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>👋 Xin chào!</h1>

        <p id="user-info">
            Đang kết nối với Telegram...
        </p>

        <button onclick="showUser()">
            Kiểm tra tài khoản
        </button>

    </div>
</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;

    if (user) {

        document.getElementById("user-info").innerHTML =
            "Xin chào <b>" +
            (user.first_name || "") +
            "</b> 👋<br><br>" +
            "Bạn đã kết nối thành công với Telegram.";

    } else {

        document.getElementById("user-info").innerText =
            "Không lấy được thông tin Telegram.";

    }

    function showUser() {

        if (!user) {
            alert("Không tìm thấy tài khoản Telegram.");
            return;
        }

        alert(
            "Tên: " + (user.first_name || "") +
            "\nUsername: @" + (user.username || "Không có") +
            "\nID: " + user.id
        );

    }

</script>

</body>
</html>
